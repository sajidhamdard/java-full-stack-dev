name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate curriculum
        run: npm run validate:curriculum

      - name: Check TypeScript
        run: npm run typecheck

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sajidhamdard.github.io/java-full-stack-dev

      - name: Verify static export
        run: |
          test -f out/index.html
          test -d out/_next/static
          grep -q 'ORDERED TECHNOLOGY CURRICULA' out/index.html
          grep -q '"/java-full-stack-dev/_next/' out/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4